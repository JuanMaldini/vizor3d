server {
    listen 80;
    root /usr/share/nginx/html;
    # Redirecciones relativas: detrás del proxy de Dokploy (HTTPS) no se filtra http://host:80
    absolute_redirect off;

    location = / {
        return 302 /vizor3d/;
    }

    location = /vizor3d {
        return 301 /vizor3d/;
    }

    # Assets con hash de Vite
    location /vizor3d/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback para React Router
    location /vizor3d/ {
        try_files $uri $uri/ /vizor3d/index.html;
    }
}
