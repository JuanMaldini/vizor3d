<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; url=/index.html?p=%2F" />
    <script>
      (function () {
        // Preserve full path + query when served by static hosts without SPA fallback
        var l = window.location;
        var p = encodeURIComponent(l.pathname + l.search + l.hash);
        // respect base if app is deployed under a subpath
        var base = (document.querySelector('base') || {}).href || '/';
        var target = base.replace(/\/$/, '') + '/index.html?p=' + p;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
